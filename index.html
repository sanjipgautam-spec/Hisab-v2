<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hisab — Family Ledger [FRESH-START]</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com">
<link rel="preconnect" href="https://firestore.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js" defer></script>
<style>
  :root {
    --paper: #ECE4CD;
    --paper-dark: #E1D6B8;
    --ink: #2B2620;
    --ink-soft: #6B6255;
    --rule: #C7B98F;
    --rule-strong: #A9986A;
    --maroon: #6B1F22;
    --maroon-dark: #501619;
    --red: #A13D2E;
    --green: #3D6B4A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    line-height: 1.5;
  }
  .app { max-width: 920px; margin: 0 auto; padding: 0 20px 60px; }

  .cover {
    background: var(--maroon);
    color: #EFE3C8;
    margin: 0 -20px 28px;
    padding: 22px 20px 18px;
    border-bottom: 6px solid var(--maroon-dark);
  }
  .cover-inner {
    max-width: 920px; margin: 0 auto;
    display: flex; align-items: baseline; justify-content: space-between;
    flex-wrap: wrap; gap: 8px;
  }
  .cover h1 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 30px; margin: 0; letter-spacing: 0.3px; }
  .cover .tagline { font-size: 13px; color: #D8C9A3; margin-top: 2px; }
  .cover .who { font-size: 13px; color: #D8C9A3; text-align: right; }
  .cover .who button { background: none; border: none; color: #EFE3C8; text-decoration: underline; cursor: pointer; font-size: 12px; padding: 0; margin-left: 6px; }
  .cover .status { font-size: 11px; margin-top: 2px; }
  .status.ok { color: #B9D6BB; }
  .status.err { color: #E4B3A8; }
  .status.cache { color: #D8C9A3; }

  .summary {
    display: grid; grid-template-columns: repeat(4, 1fr);
    border: 1px solid var(--rule-strong); background: var(--paper-dark); margin-bottom: 28px;
  }
  .summary-cell { padding: 16px 18px; border-right: 1px solid var(--rule-strong); }
  .summary-cell:last-child { border-right: none; }
  .summary-label { font-size: 12px; color: var(--ink-soft); margin-bottom: 6px; }
  .summary-value { font-family: 'IBM Plex Mono', monospace; font-size: 20px; font-weight: 600; }
  .summary-value.in { color: var(--green); }
  .summary-value.out { color: var(--red); }
  @media (max-width: 680px) {
    .summary { grid-template-columns: repeat(2, 1fr); }
    .summary-cell:nth-child(2) { border-right: none; }
  }

  .section-head { display: flex; align-items: baseline; justify-content: space-between; border-bottom: 2px solid var(--ink); padding-bottom: 6px; margin-bottom: 12px; }
  .section-head h2 { font-family: 'Fraunces', serif; font-size: 18px; font-weight: 600; margin: 0; }
  .btn { font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; font-weight: 500; background: var(--ink); color: var(--paper); border: none; padding: 7px 13px; cursor: pointer; }
  .btn:hover { background: var(--maroon); }
  .btn.secondary { background: transparent; color: var(--ink); border: 1px solid var(--rule-strong); }
  .btn.secondary:hover { border-color: var(--ink); background: var(--paper-dark); }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .btn.wide { width: 100%; padding: 11px; font-size: 14px; }
  .link-btn { background: none; border: none; color: var(--maroon); text-decoration: underline; cursor: pointer; font-size: 13px; padding: 0; font-family: 'IBM Plex Sans', sans-serif; }

  section.block { margin-bottom: 32px; }

  .party-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 4px; border-bottom: 1px solid var(--rule); cursor: pointer; }
  .party-row:hover { background: var(--paper-dark); }
  .party-name { font-weight: 500; }
  .party-sub { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .party-balance { font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 600; text-align: right; }
  .party-balance .tag { display: block; font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; font-weight: 400; color: var(--ink-soft); }
  .balance-owe-them { color: var(--red); }
  .balance-owed-you { color: var(--green); }
  .balance-zero { color: var(--ink-soft); }

  .empty-note { color: var(--ink-soft); font-size: 13px; padding: 16px 4px; font-style: italic; }

  .entry-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 4px; border-bottom: 1px solid var(--rule); }
  .entry-left { display: flex; flex-direction: column; }
  .entry-cat { font-weight: 500; font-size: 14px; }
  .entry-meta { font-size: 12px; color: var(--ink-soft); margin-top: 1px; }
  .entry-amount { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 14px; }
  .entry-row .del-x { background: none; border: none; color: var(--ink-soft); cursor: pointer; font-size: 15px; margin-left: 10px; padding: 2px 6px; }
  .entry-row .del-x:hover { color: var(--red); }
  .entry-right { display: flex; align-items: center; }

  .overlay { position: fixed; inset: 0; background: rgba(43,38,32,0.45); display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; z-index: 100; }
  .modal { background: var(--paper); border: 1px solid var(--rule-strong); max-width: 480px; width: 100%; padding: 24px; box-shadow: 0 12px 32px rgba(0,0,0,0.25); }
  .modal h3 { font-family: 'Fraunces', serif; font-size: 19px; margin: 0 0 16px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--ink-soft); margin-bottom: 4px; }
  .field input, .field select { width: 100%; padding: 9px 10px; border: 1px solid var(--rule-strong); background: #FBF8EF; font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; color: var(--ink); }
  .field input:focus, .field select:focus { outline: 2px solid var(--maroon); outline-offset: 1px; }
  .field .hint { font-size: 11px; color: var(--ink-soft); margin-top: 4px; }
  .type-toggle { display: flex; gap: 8px; flex-wrap: wrap; }
  .type-toggle button { flex: 1; min-width: 120px; padding: 9px 8px; font-size: 13px; border: 1px solid var(--rule-strong); background: #FBF8EF; color: var(--ink); cursor: pointer; }
  .type-toggle button.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
  .error-text { color: var(--red); font-size: 12px; margin-top: 6px; min-height: 14px; }
  .notice-text { color: var(--green); font-size: 12px; margin-bottom: 14px; }

  .panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .panel-header h3 { font-family: 'Fraunces', serif; font-size: 22px; margin: 0; }
  .panel-balance { font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 600; margin-bottom: 18px; }
  .ledger-table { width: 100%; border-collapse: collapse; margin-bottom: 18px; }
  .ledger-table th { text-align: left; font-size: 11px; color: var(--ink-soft); font-weight: 500; border-bottom: 2px solid var(--ink); padding: 6px 6px; }
  .ledger-table td { padding: 8px 6px; border-bottom: 1px solid var(--rule); font-size: 13px; vertical-align: top; }
  .ledger-table td.amt, .ledger-table th.amt { text-align: right; font-family: 'IBM Plex Mono', monospace; }
  .ledger-table .del-x { background: none; border: none; color: var(--ink-soft); cursor: pointer; font-size: 14px; }
  .ledger-table .del-x:hover { color: var(--red); }

  .loading-screen { padding: 60px 20px; text-align: center; color: var(--ink-soft); font-style: italic; }
  .setup-screen { padding: 40px 20px; max-width: 560px; margin: 0 auto; }
  .setup-screen h2 { font-family: 'Fraunces', serif; }
  .setup-screen code { background: var(--paper-dark); padding: 2px 6px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; }
  .setup-screen ol { padding-left: 20px; }
  .setup-screen li { margin-bottom: 8px; }

  .top-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 24px; }
  .footer-note { margin-top: 40px; font-size: 12px; color: var(--ink-soft); border-top: 1px solid var(--rule); padding-top: 14px; }
  .by-tag { color: var(--ink-soft); }

  .auth-wrap { max-width: 400px; margin: 40px auto; padding: 0 20px; }
  .auth-card { background: var(--paper-dark); border: 1px solid var(--rule-strong); padding: 28px 24px; }
  .auth-card h2 { font-family: 'Fraunces', serif; font-size: 22px; margin: 0 0 4px; }
  .auth-card .sub { font-size: 13px; color: var(--ink-soft); margin-bottom: 20px; }
  .auth-links { display: flex; flex-direction: column; gap: 10px; align-items: center; margin-top: 16px; }
</style>
</head>
<body>

<div class="cover">
  <div class="cover-inner">
    <div>
      <h1>Hisab</h1>
      <div class="tagline">Your family's shared income &amp; expense ledger</div>
    </div>
    <div class="who" id="who-box" style="display:none;">
      <div>You're logged as <strong id="current-user-label">—</strong><button onclick="logout()">log out</button></div>
      <div class="status" id="sync-status">connecting…</div>
    </div>
  </div>
</div>

<div id="auth-container"></div>

<div class="app" id="app-container" style="display:none;">
  <div id="content">
    <div class="loading-screen">Opening your ledger…</div>
  </div>
</div>

<script>
/* ============================================================
   1) PASTE YOUR FIREBASE CONFIG BELOW
   Get this from: Firebase console → Project settings → your web app
   Replace the whole object, then save this file and reopen it.
   Make sure Authentication → Sign-in method → Email/Password is
   enabled in the Firebase console, or login/register will fail.
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyA24r6PUWWmriwwZgZTtsk-WTkVt65sK0U",
  authDomain: "guatam-family-hisab.firebaseapp.com",
  projectId: "guatam-family-hisab",
  storageBucket: "guatam-family-hisab.firebasestorage.app",
  messagingSenderId: "1048525968220",
  appId: "1:1048525968220:web:2dc70661e296d3964fe799"
};
/* ============================================================ */

const DOC_PATH = { collection: 'hisab-family', doc: 'ledger' };
const CACHE_KEY = 'hisab-data-cache'; // last-known ledger, stored per-device for instant reloads

let data = { parties: [], transactions: [], entries: [] };
let loaded = false;
let db = null;
let auth = null;
let docRef = null;
let ledgerUnsub = null;
let ledgerStarted = false;
let currentUser = '';
let userProfile = null;
let activeModal = null;
let activePartyId = null;
let txnTypeChoice = 'purchase';
let entryTypeChoice = 'expense';

// ---------- Auth state ----------
let authScreen = 'login'; // login | register | awaitingVerification | forgotEmail | forgotSent | resetPassword
let authNotice = '';
let authError = '';
let resetOobCode = null;
let resetEmail = '';

const EXPENSE_CATEGORIES = ['Food', 'Transport', 'Utilities', 'Rent', 'Health', 'Shopping', 'Entertainment', 'Other'];
const INCOME_CATEGORIES = ['Salary', 'Freelance', 'Gift', 'Interest', 'Other'];

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function todayStr() { return new Date().toISOString().slice(0, 10); }
function fmt(n) { return 'Rs ' + (Number(n) || 0).toLocaleString('en-IN'); }
function formatDate(d) { return new Date(d + 'T00:00:00').toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }); }
function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
function returnUrl() { return window.location.origin + window.location.pathname; }

// ---------- Setup check ----------
function configIsPlaceholder() {
  return !firebaseConfig.apiKey || firebaseConfig.apiKey.indexOf('PASTE_') === 0;
}

function showSetupScreen() {
  document.getElementById('auth-container').innerHTML = `
    <div class="setup-screen">
      <h2>One more step</h2>
      <p>This app needs to be connected to your family's shared Firebase database before it can save or sync anything.</p>
      <ol>
        <li>Open this HTML file in a text editor (Notepad, TextEdit, or VS Code).</li>
        <li>Find the block near the top that starts with <code>const firebaseConfig = {</code></li>
        <li>Replace it with the config Firebase gave you when you registered your web app.</li>
        <li>Save the file and reopen it in your browser.</li>
      </ol>
      <p>If you're not sure how to edit the file, just paste your Firebase config back in the chat with Claude and ask for the finished file.</p>
    </div>`;
}

// ---------- Friendly error messages ----------
function friendlyAuthError(code) {
  const map = {
    'auth/email-already-in-use': 'An account with that email already exists.',
    'auth/invalid-email': 'That email address doesn\'t look right.',
    'auth/weak-password': 'Password should be at least 6 characters.',
    'auth/user-not-found': 'No account found with those details.',
    'auth/wrong-password': 'Incorrect username or password.',
    'auth/invalid-credential': 'Incorrect username or password.',
    'auth/too-many-requests': 'Too many attempts — please wait a bit and try again.',
    'auth/invalid-action-code': 'That link is invalid or has already been used.',
    'auth/expired-action-code': 'That link has expired — please request a new one.'
  };
  return map[code] || 'Something went wrong. Please try again.';
}

// ---------- Auth screen rendering ----------
function showAuthUI() {
  document.getElementById('auth-container').style.display = 'block';
  document.getElementById('app-container').style.display = 'none';
  document.getElementById('who-box').style.display = 'none';
}

function showAppUI() {
  document.getElementById('auth-container').style.display = 'none';
  document.getElementById('app-container').style.display = 'block';
  document.getElementById('who-box').style.display = 'block';
}

function renderAuthScreen() {
  const el = document.getElementById('auth-container');
  const noticeHtml = authNotice ? `<div class="notice-text">${escapeHtml(authNotice)}</div>` : '';
  const errorHtml = `<div class="error-text">${escapeHtml(authError)}</div>`;
  let inner = '';

  if (authScreen === 'login') {
    inner = `
      <h2>Log in</h2>
      <div class="sub">Enter your username and password.</div>
      ${noticeHtml}
      <div class="field"><label>Username</label><input type="text" id="login-username" autocomplete="username" placeholder="e.g. sita_gautam"></div>
      <div class="field"><label>Password</label><input type="password" id="login-password" autocomplete="current-password" placeholder="••••••••"></div>
      ${errorHtml}
      <button class="btn wide" onclick="handleLogin()">Login</button>
      <div class="auth-links">
        <button class="link-btn" onclick="goToScreen('register')">Register</button>
        <button class="link-btn" onclick="goToScreen('forgotEmail')">Forgot password?</button>
      </div>`;
  } else if (authScreen === 'register') {
    inner = `
      <h2>Create your account</h2>
      <div class="sub">Everyone in the family gets their own login.</div>
      ${noticeHtml}
      <div class="field"><label>Full Name</label><input type="text" id="reg-fullname" placeholder="e.g. Sita Gautam"></div>
      <div class="field"><label>Phone Number</label><input type="tel" id="reg-phone" placeholder="e.g. 98XXXXXXXX"></div>
      <div class="field"><label>Email Id</label><input type="email" id="reg-email" autocomplete="email" placeholder="you@example.com"></div>
      <div class="field"><label>Username</label><input type="text" id="reg-username" autocomplete="username" placeholder="Pick any username"></div>
      <div class="field"><label>Password</label><input type="password" id="reg-password" autocomplete="new-password" placeholder="At least 6 characters">
        <div class="hint">At least 6 characters.</div></div>
      <div class="field"><label>Confirm Password</label><input type="password" id="reg-confirm-password" autocomplete="new-password" placeholder="Re-enter password"></div>
      ${errorHtml}
      <button class="btn wide" onclick="handleRegister()">Register</button>
      <div class="auth-links"><button class="link-btn" onclick="goToScreen('login')">Already have an account? Log in</button></div>`;
  } else if (authScreen === 'awaitingVerification') {
    inner = `
      <h2>Check your email</h2>
      <div class="sub">We sent a verification link to <strong>${escapeHtml(authNoticeEmail())}</strong>. Click it, then come back and log in.</div>
      ${errorHtml}
      <button class="btn wide secondary" onclick="handleResendVerification()">Resend verification email</button>
      <div class="auth-links"><button class="link-btn" onclick="goToScreen('login')">Back to login</button></div>`;
  } else if (authScreen === 'forgotEmail') {
    inner = `
      <h2>Forgot password</h2>
      <div class="sub">Enter the email you registered with — we'll send a reset link.</div>
      ${noticeHtml}
      <div class="field"><label>Registered Email Id</label><input type="email" id="forgot-email" autocomplete="email" placeholder="you@example.com"></div>
      ${errorHtml}
      <button class="btn wide" onclick="handleForgotSubmit()">Send reset link</button>
      <div class="auth-links"><button class="link-btn" onclick="goToScreen('login')">Back to login</button></div>`;
  } else if (authScreen === 'forgotSent') {
    inner = `
      <h2>Check your email</h2>
      <div class="sub">If that email is registered, a password reset link is on its way. Click it to set a new password.</div>
      <div class="auth-links"><button class="link-btn" onclick="goToScreen('login')">Back to login</button></div>`;
  } else if (authScreen === 'resetPassword') {
    inner = `
      <h2>Set a new password</h2>
      <div class="sub">For ${escapeHtml(resetEmail)}</div>
      <div class="field"><label>New Password</label><input type="password" id="reset-new-password" autocomplete="new-password" placeholder="At least 6 characters"></div>
      <div class="field"><label>Confirm New Password</label><input type="password" id="reset-confirm-password" autocomplete="new-password" placeholder="Re-enter new password"></div>
      ${errorHtml}
      <button class="btn wide" onclick="handleResetPasswordSubmit()">Done</button>`;
  }

  el.innerHTML = `<div class="auth-wrap"><div class="auth-card">${inner}</div></div>`;
}

let lastRegisteredEmail = '';
function authNoticeEmail() { return lastRegisteredEmail || (auth && auth.currentUser ? auth.currentUser.email : ''); }

function goToScreen(screen) {
  authScreen = screen;
  authError = '';
  authNotice = '';
  renderAuthScreen();
}

// ---------- Auth actions ----------
async function handleLogin() {
  authError = '';
  const username = (document.getElementById('login-username').value || '').trim().toLowerCase();
  const password = document.getElementById('login-password').value || '';
  if (!username || !password) { authError = 'Enter your username and password.'; renderAuthScreen(); return; }
  try {
    const nameDoc = await db.collection('hisab-usernames').doc(username).get();
    if (!nameDoc.exists) { authError = 'Incorrect username or password.'; renderAuthScreen(); return; }
    const email = nameDoc.data().email;
    await auth.signInWithEmailAndPassword(email, password);
    // onAuthStateChanged takes it from here
  } catch (e) {
    console.error(e);
    authError = friendlyAuthError(e.code);
    renderAuthScreen();
  }
}

async function handleRegister() {
  authError = '';
  const fullName = (document.getElementById('reg-fullname').value || '').trim();
  const phone = (document.getElementById('reg-phone').value || '').trim();
  const email = (document.getElementById('reg-email').value || '').trim();
  const usernameRaw = (document.getElementById('reg-username').value || '').trim();
  const username = usernameRaw.toLowerCase();
  const password = document.getElementById('reg-password').value || '';
  const confirmPassword = document.getElementById('reg-confirm-password').value || '';

  if (!fullName || !phone || !email || !usernameRaw || !password || !confirmPassword) {
    authError = 'Please fill in every field.'; renderAuthScreen(); return;
  }
  if (!/^[a-z0-9_.]{3,20}$/.test(username)) {
    authError = 'Username should be 3-20 characters: letters, numbers, dot or underscore.'; renderAuthScreen(); return;
  }
  if (password.length < 6) { authError = 'Password should be at least 6 characters.'; renderAuthScreen(); return; }
  if (password !== confirmPassword) { authError = 'Password and Confirm Password don\'t match.'; renderAuthScreen(); return; }

  try {
    const nameDoc = await db.collection('hisab-usernames').doc(username).get();
    if (nameDoc.exists) { authError = 'That username is already taken.'; renderAuthScreen(); return; }

    const cred = await auth.createUserWithEmailAndPassword(email, password);
    const user = cred.user;
    await user.updateProfile({ displayName: fullName });
    await db.collection('hisab-users').doc(user.uid).set({
      fullName, phone, email, username, createdAt: new Date().toISOString()
    });
    await db.collection('hisab-usernames').doc(username).set({ uid: user.uid, email });
    await user.sendEmailVerification({ url: returnUrl() });
    lastRegisteredEmail = email;
    goToScreen('awaitingVerification');
  } catch (e) {
    console.error(e);
    authError = friendlyAuthError(e.code);
    renderAuthScreen();
  }
}

async function handleResendVerification() {
  authError = '';
  try {
    if (auth.currentUser) {
      await auth.currentUser.sendEmailVerification({ url: returnUrl() });
      authNotice = 'Verification email sent again.';
    } else {
      authError = 'Please log in again to resend the verification email.';
      goToScreen('login'); return;
    }
    renderAuthScreen();
  } catch (e) {
    console.error(e);
    authError = friendlyAuthError(e.code);
    renderAuthScreen();
  }
}

async function handleForgotSubmit() {
  authError = '';
  const email = (document.getElementById('forgot-email').value || '').trim();
  if (!email) { authError = 'Enter your registered email.'; renderAuthScreen(); return; }
  try {
    await auth.sendPasswordResetEmail(email, { url: returnUrl() });
  } catch (e) {
    console.error(e);
    // Don't reveal whether the email exists; only show a real error for bad input.
    if (e.code !== 'auth/user-not-found') {
      authError = friendlyAuthError(e.code); renderAuthScreen(); return;
    }
  }
  goToScreen('forgotSent');
}

async function handleResetPasswordSubmit() {
  authError = '';
  const newPassword = document.getElementById('reset-new-password').value || '';
  const confirmNewPassword = document.getElementById('reset-confirm-password').value || '';
  if (newPassword.length < 6) { authError = 'Password should be at least 6 characters.'; renderAuthScreen(); return; }
  if (newPassword !== confirmNewPassword) { authError = 'New Password and Confirm New Password don\'t match.'; renderAuthScreen(); return; }
  try {
    await auth.confirmPasswordReset(resetOobCode, newPassword);
    authNotice = 'Password updated! Please log in.';
    goToScreen('login');
  } catch (e) {
    console.error(e);
    authError = friendlyAuthError(e.code);
    renderAuthScreen();
  }
}

async function logout() {
  if (ledgerUnsub) { ledgerUnsub(); ledgerUnsub = null; }
  ledgerStarted = false;
  data = { parties: [], transactions: [], entries: [] };
  loaded = false;
  await auth.signOut();
}

// ---------- Handle email-action links (verify email / reset password) ----------
async function handleActionLink() {
  const params = new URLSearchParams(window.location.search);
  const mode = params.get('mode');
  const oobCode = params.get('oobCode');
  if (!mode || !oobCode) return false;

  history.replaceState({}, '', window.location.pathname); // strip the query params

  if (mode === 'verifyEmail') {
    try {
      await auth.applyActionCode(oobCode);
      authNotice = 'Email verified! You can now log in.';
    } catch (e) {
      authError = friendlyAuthError(e.code);
    }
    authScreen = 'login';
    return true;
  }
  if (mode === 'resetPassword') {
    try {
      const email = await auth.verifyPasswordResetCode(oobCode);
      resetEmail = email;
      resetOobCode = oobCode;
      authScreen = 'resetPassword';
    } catch (e) {
      authError = friendlyAuthError(e.code);
      authScreen = 'login';
    }
    return true;
  }
  return false;
}

// ---------- Local cache (makes refreshes instant) ----------
function loadFromCache() {
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    if (!raw) return;
    const cached = JSON.parse(raw);
    if (cached && Array.isArray(cached.parties)) {
      data = cached;
      loaded = true;
      render();
      const el = document.getElementById('sync-status');
      el.textContent = 'showing saved copy — syncing…';
      el.className = 'status cache';
    }
  } catch (e) {
    console.warn('Could not read local cache:', e);
  }
}

function saveToCache() {
  try { localStorage.setItem(CACHE_KEY, JSON.stringify(data)); }
  catch (e) { console.warn('Could not write local cache:', e); }
}

// ---------- Firebase / sync ----------
function initFirebase() {
  firebase.initializeApp(firebaseConfig);
  db = firebase.app().firestore('gautam');db.settings({ experimentalForceLongPolling: true, merge: true });
  auth = firebase.auth();
  docRef = db.collection(DOC_PATH.collection).doc(DOC_PATH.doc);

  auth.onAuthStateChanged(async (user) => {
    if (!user) {
      showAuthUI();
      if (authScreen !== 'resetPassword' && authScreen !== 'forgotEmail' && authScreen !== 'forgotSent') {
        authScreen = 'login';
      }
      renderAuthScreen();
      return;
    }
    await user.reload();
    if (!user.emailVerified) {
      lastRegisteredEmail = user.email;
      showAuthUI();
      authScreen = 'awaitingVerification';
      renderAuthScreen();
      return;
    }
    try {
      const snap = await db.collection('hisab-users').doc(user.uid).get();
      userProfile = snap.exists ? snap.data() : { fullName: user.displayName || user.email };
    } catch (e) {
      userProfile = { fullName: user.displayName || user.email };
    }
    currentUser = userProfile.fullName;
    document.getElementById('current-user-label').textContent = currentUser;
    showAppUI();
    startLedgerSync();
  });
}

function startLedgerSync() {
  if (ledgerStarted) return;
  ledgerStarted = true;
  loadFromCache();
  ledgerUnsub = docRef.onSnapshot(
    (snap) => {
      if (snap.exists) {
        const d = snap.data();
        data = { parties: d.parties || [], transactions: d.transactions || [], entries: d.entries || [] };
      } else {
        data = { parties: [], transactions: [], entries: [] };
      }
      loaded = true;
      saveToCache();
      setStatus(true);
      render();
    },
    (err) => {
      console.error('Sync error:', err);
      setStatus(false, err.message);
    }
  );
}

function setStatus(ok, msg) {
  const el = document.getElementById('sync-status');
  if (ok) { el.textContent = 'synced just now'; el.className = 'status ok'; }
  else { el.textContent = 'sync problem — ' + (msg || 'check your connection'); el.className = 'status err'; }
}

async function saveData() {
  if (!docRef) return;
  try {
    await docRef.set(data);
    saveToCache();
    setStatus(true);
  } catch (e) {
    console.error('Could not save:', e);
    setStatus(false, 'could not save that change');
    alert("That didn't save — check your internet connection and try again.");
  }
}

// ---------- Calculations ----------
function partyBalance(partyId) {
  let bal = 0;
  data.transactions.filter(t => t.partyId === partyId).forEach(t => {
    if (t.type === 'purchase') bal -= t.amount;
    if (t.type === 'payment_made') bal += t.amount;
    if (t.type === 'sale') bal += t.amount;
    if (t.type === 'payment_received') bal -= t.amount;
  });
  return bal;
}

function totals() {
  const saleTotal = data.transactions.filter(t => t.type === 'sale').reduce((s, t) => s + t.amount, 0);
  const purchaseTotal = data.transactions.filter(t => t.type === 'purchase').reduce((s, t) => s + t.amount, 0);
  const entryIncome = data.entries.filter(e => e.type === 'income').reduce((s, e) => s + e.amount, 0);
  const entryExpense = data.entries.filter(e => e.type === 'expense').reduce((s, e) => s + e.amount, 0);
  const totalIncome = saleTotal + entryIncome;
  const totalExpense = purchaseTotal + entryExpense;
  let receivable = 0, payable = 0;
  data.parties.forEach(p => {
    const b = partyBalance(p.id);
    if (b > 0) receivable += b;
    if (b < 0) payable += Math.abs(b);
  });
  return { totalIncome, totalExpense, receivable, payable };
}

// ---------- Rendering ----------
function render() {
  const el = document.getElementById('content');
  if (!loaded) { el.innerHTML = '<div class="loading-screen">Opening your ledger…</div>'; return; }

  const t = totals();
  let html = '';

  html += `<div class="summary">
    <div class="summary-cell"><div class="summary-label">Total income</div><div class="summary-value in">${fmt(t.totalIncome)}</div></div>
    <div class="summary-cell"><div class="summary-label">Total expense</div><div class="summary-value out">${fmt(t.totalExpense)}</div></div>
    <div class="summary-cell"><div class="summary-label">Owed to us</div><div class="summary-value in">${fmt(t.receivable)}</div></div>
    <div class="summary-cell"><div class="summary-label">We owe</div><div class="summary-value out">${fmt(t.payable)}</div></div>
  </div>`;

  html += `<div class="top-actions">
    <button class="btn" onclick="openModal('party')">+ Add party</button>
    <button class="btn secondary" onclick="openModal('entry')">+ Add income / expense</button>
  </div>`;

  html += `<section class="block"><div class="section-head"><h2>Parties</h2></div>`;
  if (data.parties.length === 0) {
    html += `<div class="empty-note">No parties yet. Add someone the family buys from, sells to, or lends/borrows with.</div>`;
  } else {
    const sorted = [...data.parties].sort((a, b) => Math.abs(partyBalance(b.id)) - Math.abs(partyBalance(a.id)));
    sorted.forEach(p => {
      const bal = partyBalance(p.id);
      const count = data.transactions.filter(x => x.partyId === p.id).length;
      let balClass = 'balance-zero', tag = 'settled';
      if (bal > 0) { balClass = 'balance-owed-you'; tag = 'owes us'; }
      if (bal < 0) { balClass = 'balance-owe-them'; tag = 'we owe'; }
      html += `<div class="party-row" onclick="openParty('${p.id}')">
        <div><div class="party-name">${escapeHtml(p.name)}</div><div class="party-sub">${count} ${count === 1 ? 'entry' : 'entries'}</div></div>
        <div class="party-balance ${balClass}">${fmt(Math.abs(bal))}<span class="tag">${tag}</span></div>
      </div>`;
    });
  }
  html += `</section>`;

  html += `<section class="block"><div class="section-head"><h2>Family income &amp; expenses</h2></div>`;
  if (data.entries.length === 0) {
    html += `<div class="empty-note">No entries yet. Log things like groceries, salary, or gifts here.</div>`;
  } else {
    const sorted = [...data.entries].sort((a, b) => b.date.localeCompare(a.date));
    sorted.forEach(e => {
      html += `<div class="entry-row">
        <div class="entry-left">
          <div class="entry-cat">${escapeHtml(e.category)}${e.note ? ' — ' + escapeHtml(e.note) : ''}</div>
          <div class="entry-meta">${formatDate(e.date)} · <span class="by-tag">${escapeHtml(e.addedBy || 'someone')}</span></div>
        </div>
        <div class="entry-right">
          <div class="entry-amount" style="color:${e.type === 'income' ? 'var(--green)' : 'var(--red)'}">${e.type === 'income' ? '+' : '−'} ${fmt(e.amount)}</div>
          <button class="del-x" onclick="deleteEntry('${e.id}')" title="Delete">✕</button>
        </div>
      </div>`;
    });
  }
  html += `</section>`;

  html += `<div class="footer-note">Sales and purchases count toward income/expense when they happen. Payments made or received just settle a balance, so they don't get counted twice.</div>`;

  el.innerHTML = html;
  if (activePartyId) renderPartyPanel();
  if (activeModal) renderModal();
}

// ---------- Party detail panel ----------
function openParty(id) { activePartyId = id; render(); }
function closeParty() {
  activePartyId = null;
  const existing = document.getElementById('party-overlay');
  if (existing) existing.remove();
  render();
}

function renderPartyPanel() {
  const party = data.parties.find(p => p.id === activePartyId);
  if (!party) { activePartyId = null; return; }
  const bal = partyBalance(party.id);
  const balClass = bal > 0 ? 'balance-owed-you' : (bal < 0 ? 'balance-owe-them' : 'balance-zero');
  const balLabel = bal > 0 ? 'owes us' : (bal < 0 ? 'we owe' : 'settled up');
  const txns = data.transactions.filter(t => t.partyId === party.id).sort((a, b) => a.date.localeCompare(b.date));

  let running = 0;
  const rows = txns.map(t => {
    if (t.type === 'purchase') running -= t.amount;
    if (t.type === 'payment_made') running += t.amount;
    if (t.type === 'sale') running += t.amount;
    if (t.type === 'payment_received') running -= t.amount;
    return { ...t, running };
  });

  const typeLabels = { purchase: 'Purchase (from them)', sale: 'Sale (to them)', payment_made: 'Payment made', payment_received: 'Payment received' };

  let rowsHtml = '';
  if (rows.length === 0) {
    rowsHtml = `<tr><td colspan="6" style="color:var(--ink-soft); font-style:italic;">No entries yet for ${escapeHtml(party.name)}.</td></tr>`;
  } else {
    [...rows].reverse().forEach(r => {
      const rb = r.running > 0 ? 'var(--green)' : (r.running < 0 ? 'var(--red)' : 'var(--ink-soft)');
      rowsHtml += `<tr>
        <td>${formatDate(r.date)}</td>
        <td>${typeLabels[r.type]}</td>
        <td>${escapeHtml(r.note || '—')}<br><span class="by-tag" style="font-size:11px;">by ${escapeHtml(r.addedBy || 'someone')}</span></td>
        <td class="amt">${fmt(r.amount)}</td>
        <td class="amt" style="color:${rb}">${fmt(Math.abs(r.running))}</td>
        <td><button class="del-x" onclick="deleteTxn('${r.id}')" title="Delete">✕</button></td>
      </tr>`;
    });
  }

  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.id = 'party-overlay';
  overlay.onclick = (ev) => { if (ev.target === overlay) closeParty(); };
  overlay.innerHTML = `<div class="modal" style="max-width:640px;">
    <div class="panel-header"><h3>${escapeHtml(party.name)}</h3><button class="btn secondary" onclick="closeParty()">Close</button></div>
    <div class="panel-balance ${balClass}">${fmt(Math.abs(bal))} — ${balLabel}</div>
    <div style="overflow-x:auto;">
    <table class="ledger-table">
      <thead><tr><th>Date</th><th>Type</th><th>Note</th><th class="amt">Amount</th><th class="amt">Balance</th><th></th></tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table>
    </div>
    <h3 style="font-size:15px; margin-bottom:10px;">Add entry</h3>
    <div class="type-toggle" style="margin-bottom:14px;">
      <button class="${txnTypeChoice === 'purchase' ? 'active' : ''}" onclick="setTxnType('purchase')">Purchase</button>
      <button class="${txnTypeChoice === 'sale' ? 'active' : ''}" onclick="setTxnType('sale')">Sale</button>
      <button class="${txnTypeChoice === 'payment_made' ? 'active' : ''}" onclick="setTxnType('payment_made')">Payment made</button>
      <button class="${txnTypeChoice === 'payment_received' ? 'active' : ''}" onclick="setTxnType('payment_received')">Payment received</button>
    </div>
    <div class="field"><label>Amount (Rs)</label><input type="number" id="txn-amount" min="0" step="1" placeholder="0"></div>
    <div class="field"><label>Date</label><input type="date" id="txn-date" value="${todayStr()}"></div>
    <div class="field"><label>Note (optional)</label><input type="text" id="txn-note" placeholder="What was this for?"></div>
    <div id="txn-error" class="error-text"></div>
    <div class="modal-actions"><button class="btn" onclick="submitTxn('${party.id}')">Save entry</button></div>
  </div>`;

  const existing = document.getElementById('party-overlay');
  if (existing) existing.remove();
  document.body.appendChild(overlay);
}

function setTxnType(t) { txnTypeChoice = t; renderPartyPanel(); }

async function submitTxn(partyId) {
  const amount = parseFloat(document.getElementById('txn-amount').value);
  const date = document.getElementById('txn-date').value;
  const note = document.getElementById('txn-note').value.trim();
  const errEl = document.getElementById('txn-error');
  if (!amount || amount <= 0) { errEl.textContent = 'Enter an amount greater than zero.'; return; }
  if (!date) { errEl.textContent = 'Pick a date.'; return; }
  data.transactions.push({ id: uid(), partyId, type: txnTypeChoice, amount, date, note, addedBy: currentUser });
  await saveData();
}

async function deleteTxn(id) {
  if (!confirm('Delete this entry?')) return;
  data.transactions = data.transactions.filter(t => t.id !== id);
  await saveData();
}

// ---------- Modals: add party / add entry ----------
function openModal(kind) { activeModal = kind; render(); }
function closeModal() { activeModal = null; const e = document.getElementById('generic-overlay'); if (e) e.remove(); render(); }

function renderModal() {
  const existing = document.getElementById('generic-overlay');
  if (existing) existing.remove();
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.id = 'generic-overlay';
  overlay.onclick = (ev) => { if (ev.target === overlay) closeModal(); };

  if (activeModal === 'party') {
    overlay.innerHTML = `<div class="modal">
      <h3>Add a party</h3>
      <div class="field"><label>Name</label><input type="text" id="party-name" placeholder="e.g. Ram Traders"></div>
      <div id="party-error" class="error-text"></div>
      <div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="submitParty()">Add party</button></div>
    </div>`;
  } else if (activeModal === 'entry') {
    const cats = entryTypeChoice === 'income' ? INCOME_CATEGORIES : EXPENSE_CATEGORIES;
    overlay.innerHTML = `<div class="modal">
      <h3>Add income or expense</h3>
      <div class="type-toggle" style="margin-bottom:14px;">
        <button class="${entryTypeChoice === 'expense' ? 'active' : ''}" onclick="setEntryType('expense')">Expense</button>
        <button class="${entryTypeChoice === 'income' ? 'active' : ''}" onclick="setEntryType('income')">Income</button>
      </div>
      <div class="field"><label>Category</label><select id="entry-category">${cats.map(c => `<option value="${c}">${c}</option>`).join('')}</select></div>
      <div class="field"><label>Amount (Rs)</label><input type="number" id="entry-amount" min="0" step="1" placeholder="0"></div>
      <div class="field"><label>Date</label><input type="date" id="entry-date" value="${todayStr()}"></div>
      <div class="field"><label>Note (optional)</label><input type="text" id="entry-note" placeholder="Any detail"></div>
      <div id="entry-error" class="error-text"></div>
      <div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="submitEntry()">Save</button></div>
    </div>`;
  }
  document.body.appendChild(overlay);
}

function setEntryType(t) { entryTypeChoice = t; renderModal(); }

async function submitParty() {
  const name = document.getElementById('party-name').value.trim();
  const errEl = document.getElementById('party-error');
  if (!name) { errEl.textContent = 'Enter a name.'; return; }
  data.parties.push({ id: uid(), name, createdAt: todayStr(), addedBy: currentUser });
  await saveData();
  closeModal();
}

async function submitEntry() {
  const category = document.getElementById('entry-category').value;
  const amount = parseFloat(document.getElementById('entry-amount').value);
  const date = document.getElementById('entry-date').value;
  const note = document.getElementById('entry-note').value.trim();
  const errEl = document.getElementById('entry-error');
  if (!amount || amount <= 0) { errEl.textContent = 'Enter an amount greater than zero.'; return; }
  if (!date) { errEl.textContent = 'Pick a date.'; return; }
  data.entries.push({ id: uid(), type: entryTypeChoice, category, amount, date, note, addedBy: currentUser });
  await saveData();
  closeModal();
}

async function deleteEntry(id) {
  if (!confirm('Delete this entry?')) return;
  data.entries = data.entries.filter(e => e.id !== id);
  await saveData();
}

// ---------- Init ----------
if (configIsPlaceholder()) {
  showSetupScreen();
} else {
  window.addEventListener('DOMContentLoaded', async () => {
    initFirebase();
    const handledLink = await handleActionLink();
    showAuthUI();
    renderAuthScreen();
  });
}
</script>
</body>
</html>
